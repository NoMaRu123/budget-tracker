name: App deployment              # demo step 3: launch the stack

on:
  workflow_dispatch:              # runs only when you press "Run workflow" on GitHub

concurrency:
  group: terraform                # never run deploy and destroy at the same time
  cancel-in-progress: false

permissions:
  contents: read                  # the workflows only need to READ the code, nothing more

jobs:
  tests:
    uses: ./.github/workflows/ci.yml    # demo step 4 "testing": run the CI workflow first

  deploy:
    needs: tests                        # deploy ONLY if the tests passed
    runs-on: ubuntu-latest
    env:                                # the Learner Lab keys, from GitHub Secrets (never shown)
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    defaults:
      run:
        working-directory: infra        # the Terraform files live in infra/
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false      # plain output, so the IP can be read in a later step

      - name: Terraform init           # connects to the private S3 bucket that holds the state
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve

      - name: Show the backend address
        run: |
          IP=$(terraform output -raw public_ip)
          echo "Backend: http://$IP/docs" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live backend   # is the deployed app actually answering?
        run: |
          IP=$(terraform output -raw public_ip)
          for i in $(seq 1 40); do                    # up to 10 minutes: 40 tries, 15 seconds apart
            if curl -fsS --max-time 5 "http://$IP/health" | grep -q '"status":"ok"'; then
              echo "Smoke test passed after $i tries" >> "$GITHUB_STEP_SUMMARY"
              exit 0                                  # success: stop here, the run goes green
            fi
            echo "Try $i: not answering yet (the VM is still installing the app)"
            sleep 15
          done
          echo "Smoke test FAILED: http://$IP/health never answered" >> "$GITHUB_STEP_SUMMARY"
          exit 1                                      # failure: the run goes red
