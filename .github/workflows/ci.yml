name: CI                          # the name shown in GitHub's Actions tab

on:                               # WHEN to run
  push:
    branches: [main]              # every push to main
  pull_request:
    branches: [main]              # and every pull request into main
  workflow_call:

jobs:
  test:                           # one job, called "test"
    runs-on: ubuntu-latest        # a fresh Linux machine from GitHub
    defaults:
      run:
        working-directory: backend  # main.py, the tests and the requirements live in backend/
    steps:
      - name: Check out the code
        uses: actions/checkout@v7          # a ready-made action: copies your repo onto the runner

      - name: Set up Python 3.12
        uses: actions/setup-python@v7      # installs Python, the same version as your laptop
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt   # run: = type this command in the runner's terminal

      - name: Lint with flake8             # the lecturer's commands from the W13 slide
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --statistics

      - name: Run the tests
        run: pytest -v
